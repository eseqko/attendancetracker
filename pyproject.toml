[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-tracker"
version = "0.1.0"
description = "Local Streamlit app that filters a schoolwide attendance report down to your caseload and analyzes individual and cohort trends"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds = the newest majors the suite and app are verified on,
    # so a double-click install can't pick up a breaking future release.
    "streamlit>=1.36,<2",
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "plotly>=5.18,<7",
    "openpyxl>=3.1,<4",
    # Old-format .xls files (how Synergy exports ATP201) need the xlrd engine.
    "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Writes legacy .xls fixtures in tests (pandas can no longer write .xls).
    "xlwt>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
